plugins {
  id 'idea'
  id 'scala'
  id 'application'
  id 'org.podval.conventions'
}

description = 'Domain Infrastructure'

application.mainClass = 'tld.domain.infra.Main'

dependencies {
  // The library's Besom jars are compileOnly. This project brings its own.
  implementation 'org.podval.tools:org.podval.tools.pulumi:0.6.0'

  implementation 'org.virtuslab:besom-core_3:0.5.2'
  implementation 'org.virtuslab:besom-gcp_3:9.0.0-core.0.5'
  implementation 'org.virtuslab:besom-cloudflare_3:6.20.0-core.0.5'
}

idea {
  module {
    excludeDirs += [
      file('.idea'),
      file('gradle')
    ]
  }
}

// There is no Java in the project :)
podval.compileJavaEnabled = false

// One zone, so this build does not set -Xss8m. CognoMath sets
// applicationDefaultJvmArgs = ['-Xss8m'] because eight DnsZones already
// overflow Besom Result.runM.
