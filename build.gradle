plugins {
  id 'java-library'
  id 'scala'
  id 'org.podval.conventions'
  id 'org.podval.conventions.publish'
  id 'org.podval.tools.scalajs' version '2.3.1'
}

description = 'Pulumi tooling'
group = 'org.podval.tools'

podvalPublish {
  gitHubRepository = 'dubinsky/pulumi'
  name = 'Podval Pulumi'
  inceptionYear = '2023'
}

// The published coordinate stays org.podval.tools.pulumi, with no Scala suffix.
scalaBackend {
  useArtifactSuffix = false
}

dependencies {
  compileOnly 'org.virtuslab:besom-core_3:0.5.2'
  compileOnly 'org.virtuslab:besom-gcp_3:9.0.0-core.0.5'
  compileOnly 'org.virtuslab:besom-cloudflare_3:6.20.0-core.0.5'
  testImplementation 'org.scalatest:scalatest_3:3.2.20'
}
