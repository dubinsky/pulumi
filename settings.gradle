pluginManagement {
  repositories {
    mavenCentral()
    gradlePluginPortal()
  }
  // String path: a File would call Settings.includeBuild (not a plugin build).
  // An included build does not see its parent's pluginManagement include, and 0.4.0 is not published.
  final String conventionsDir =
    providers.gradleProperty('podvalGradleDir').getOrElse('../podval-gradle')
  if (file(conventionsDir).isDirectory() && file("${conventionsDir}/settings.gradle").isFile()) {
    includeBuild conventionsDir
  }
}

plugins {
  id 'org.podval.conventions.settings' version '0.4.0'
}

podvalSettings {
  acceptVersionIf { version ->
    // Besom stable line: 9.0.0-core.0.5, 6.20.0-core.0.5. Not 1.0.0-legacy, not 0.017.
    version ==~ /[0-9]+(\.[0-9]+)*-core\.[0-9]+(\.[0-9]+)*/
  }
}

rootProject.name = 'org.podval.tools.pulumi'
